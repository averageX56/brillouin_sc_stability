[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brillouin-sde"
version = "0.3.0"
description = "Brillouin cascade SDE solver (C++) with Python analysis helpers"
requires-python = ">=3.9"
dependencies = ["numpy", "plotly", "matplotlib"]

[tool.setuptools]
packages = ["brillouin"]
